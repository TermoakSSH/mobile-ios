# Xcode project of the iOS app, generated with XcodeGen:
#   xcodegen generate
# The .xcodeproj is not versioned. scripts/build-ipa.sh generates and builds it.
name: Termoak
options:
  bundleIdPrefix: com.termoak
  # English is the source language; the translations live in
  # Termoak/Localizable.xcstrings (see core/docs/I18N.md).
  developmentLanguage: en
  # 2.39 reads the languages of the String Catalogs into knownRegions.
  minimumXcodeGenVersion: 2.39.0
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

packages:
  TermoakKit:
    # Swift package of TermoakSSH/core, a git submodule in core/.
    path: core/bindings/swift
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    # 1.20: `pressesBegan` is `open` (hardware keys, TerminalInput.swift),
    # the search API (⌘F) and `showStandardContextMenu` (secondary click).
    from: 1.20.0

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.6.0"
    CURRENT_PROJECT_VERSION: "15"

targets:
  Termoak:
    type: application
    platform: iOS
    sources:
      - path: Termoak
    # Languages the app offers (also in the per-app language of the system
    # settings). Keep in sync with the languages of Localizable.xcstrings.
    info:
      path: Termoak/Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, es]
        # XcodeGen would write 1.0 / 1 here otherwise.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Invitation links open the app: termoak://join?server=…&token=…
        # (https://termoak.com/join/<token> too: Universal Links, see
        # Termoak/Termoak.entitlements and Signing.xcconfig).
        CFBundleURLTypes:
          - CFBundleURLName: com.termoak.links
            CFBundleTypeRole: Viewer
            CFBundleURLSchemes: [termoak]
    dependencies:
      - package: TermoakKit
      - package: SwiftTerm
    # The Team ID and the entitlements (Associated Domains for Universal Links).
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.termoak
        PRODUCT_NAME: Termoak
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Termoak
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        # Translated in Termoak/InfoPlist.xcstrings.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "To connect over SSH to computers on your local network."
        # The Rust library is static and carries no bitcode or Swift debug symbols.
        DEBUG_INFORMATION_FORMAT: dwarf

  # Unit tests of the pure logic (no app host, no sshd): they compile the
  # files they test directly. `xcodebuild test -only-testing:TermoakTests`.
  TermoakTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: UnitTests
      - path: Termoak/Model/HardwareKeys.swift
      - path: Termoak/Model/Keys.swift
      - path: Termoak/Model/HostProtocols.swift
      - path: Termoak/Model/HostLogos.swift
      - path: Termoak/Model/Layouts.swift
      - path: Termoak/Model/RemotePaths.swift
      - path: Termoak/Model/ShareJson.swift
      - path: Termoak/Model/EngineMessages.swift
      - path: Termoak/Model/NoticeDeduper.swift
      - path: Termoak/Model/ApprovalPreview.swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.termoak.tests

  # UI tests (only `xcodebuild test`; not in the .ipa). They need a test
  # sshd: see UITests/KeyboardUITests.swift.
  TermoakUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Termoak
    settings:
      base:
        TEST_TARGET_NAME: Termoak
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.termoak.uitests

schemes:
  Termoak:
    build:
      targets:
        Termoak: all
    test:
      targets:
        - TermoakTests
        - TermoakUITests
