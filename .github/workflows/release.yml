name: Release

# Builds the unsigned .ipa on a macOS runner and creates the ios-vX.Y.Z
# release as a DRAFT with it (MARKETING_VERSION in project.yml). Publish the
# draft from the Releases page once it has been checked.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ipa:
    name: Unsigned .ipa
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim, x86_64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Tools
        run: |
          brew install xcodegen
          xcodebuild -downloadComponent MetalToolchain || true
      - name: Version
        id: version
        run: |
          version="$(sed -n '/MARKETING_VERSION:/{s/.*"\(.*\)"/\1/p;q;}' project.yml)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build the .ipa
        run: scripts/build-ipa.sh
      - name: Upload the build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: target/ios-app/xcodebuild.log
      - name: Draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: iOS ${{ steps.version.outputs.version }}
          draft: true
          make_latest: true
          body: |
            Termoak for iOS ${{ steps.version.outputs.version }}.

            The .ipa is **unsigned**: sign it with your own certificate
            (Sideloadly, AltStore, or `codesign` with a provisioning profile).
          files: dist/ios/*.ipa
          fail_on_unmatched_files: true
