name: CI

# Basic checks only (no macOS runner): the app itself is built on a Mac with
# scripts/build-ipa.sh.
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md", "LICENSE"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md", "LICENSE"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Project files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: String catalogs are valid JSON and project.yml is valid YAML
        run: |
          for f in Termoak/*.xcstrings; do python3 -m json.tool "$f" >/dev/null && echo "ok $f"; done
          python3 -c "import yaml; yaml.safe_load(open('project.yml'))" && echo "ok project.yml"
